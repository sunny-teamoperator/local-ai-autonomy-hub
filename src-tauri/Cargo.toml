[package]
name = "local-ai-autonomy-hub"
version = "0.1.0"
description = "A local-first desktop command center for AI tools and automations."
authors = ["Sunny TeamOperator"]
edition = "2021"

[lib]
name = "local_ai_autonomy_hub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0" }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.0.0" }

[features]
custom-protocol = ["tauri/custom-protocol"]
default = ["custom-protocol"]
